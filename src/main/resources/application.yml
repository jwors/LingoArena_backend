spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lingoarena
    username: lingoarena
    password: lingoarena
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  redis:
    host: localhost
    port: 6379
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:bGluZ29hcmVuYS1kZXYtand0LXNlY3JldC1rZXktZm9yLWhtYWMtc2hhMjU2LW1pbi0zMmNoYXJz}
  access-token-expiration-minutes: 15
  refresh-token-expiration-days: 7

game:
  round:
    time-limit-seconds: 15

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://192.168.1.10:5173

server:
  port: 8080
